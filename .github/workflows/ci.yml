name: Kgaga CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o /tmp/kgaga ./cmd/kgaga
      - name: Verify CLI passport lifecycle
        run: bash scripts/test-passport-lifecycle.sh /tmp/kgaga
