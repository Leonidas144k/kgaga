name: Kgaga CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Repeat Sentinel delivery recovery and incident security regressions
        run: go test -race -count=10 ./internal/sentinel
      - name: Repeat replay concurrency regression tests
        run: go test -race -count=10 ./internal/revocation
      - name: Fuzz passport envelope parser
        run: go test ./internal/passport -run=^$ -fuzz=^FuzzPassportEnvelope$ -fuzztime=5s -parallel=2
      - name: Repeat Vault audit failure tests
        run: go test -race -count=10 ./internal/audit
      - name: Repeat integrated credential brokerage regression
        run: go test -race -count=3 ./internal/proxy -run=^TestVaultCredentialInjection$
      - name: Fuzz Vault record and provider formats
        run: go test ./internal/vault -run=^$ -fuzz=^FuzzVaultFormats$ -fuzztime=10s -parallel=2
      - run: go build -trimpath -o /tmp/kgaga ./cmd/kgaga
      - name: Verify synthetic Sentinel runtime CLI
        run: |
          /tmp/kgaga demo-sentinel --synthetic > /tmp/kgaga-sentinel-demo.json
          python3 - <<'PY'
          import json
          with open("/tmp/kgaga-sentinel-demo.json", encoding="utf-8") as f:
              actual = json.load(f)
          assert actual == {
              "mode": "synthetic",
              "advisory_signals": 1,
              "incident_transitions": 3,
              "verified_ledger_records": 8,
              "recovered_state": "resolved",
              "notifications_sent": 0,
              "production_configured": False,
          }, "unexpected runtime demo output"
          PY
      - name: Verify CLI passport lifecycle
        run: bash scripts/test-passport-lifecycle.sh /tmp/kgaga
