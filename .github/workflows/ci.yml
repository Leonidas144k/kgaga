name: Kgaga CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Repeat Sentinel advisory detection regressions
        run: go test -race -count=10 ./internal/sentinel
      - name: Repeat replay concurrency regression tests
        run: go test -race -count=10 ./internal/revocation
      - name: Fuzz passport envelope parser
        run: go test ./internal/passport -run=^$ -fuzz=^FuzzPassportEnvelope$ -fuzztime=5s -parallel=2
      - name: Repeat Vault audit failure tests
        run: go test -race -count=10 ./internal/audit
      - name: Repeat integrated credential brokerage regression
        run: go test -race -count=3 ./internal/proxy -run=^TestVaultCredentialInjection$
      - name: Fuzz Vault record and provider formats
        run: go test ./internal/vault -run=^$ -fuzz=^FuzzVaultFormats$ -fuzztime=10s -parallel=2
      - run: go build -trimpath -o /tmp/kgaga ./cmd/kgaga
      - name: Verify CLI passport lifecycle
        run: bash scripts/test-passport-lifecycle.sh /tmp/kgaga
